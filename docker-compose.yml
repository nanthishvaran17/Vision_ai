version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: visionnext_db
    environment:
      POSTGRES_USER: visionnext
      POSTGRES_PASSWORD: visionnext_password
      POSTGRES_DB: visionnext_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionnext -d visionnext_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionnext_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://visionnext:visionnext_password@db:5432/visionnext_db
      JWT_SECRET: super-secret-visionnext-jwt-key-2026-codienych-secure
      LLM_PROVIDER: openai
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionnext_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
